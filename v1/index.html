<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        background: #f7f8fa;
      }
      #checkout-container {
        display: flex;
        justify-content: center;
      }
      #pay-button {
        padding: 10px 20px;
        margin-top: 30px;
        background-color: #4a90e2;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      #payButton:hover {
        background-color: #357abd;
      }
      .cart-details {
        font-size: 3rem;
        font-weight: bold;
        padding: 2rem;
        display: flex;
        justify-content: center;
      }
      .button-container {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .tab-container {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }
      .tab {
        padding: 10px 20px;
        cursor: pointer;
        background-color: #f1f1f1;
        border: 1px solid #ccc;
        border-bottom: none;
        margin-right: 5px;
      }
      .tab.active {
        background-color: #fff;
        border-bottom: 1px solid #4a90e2;
      }
      .tab-content {
        display: none;
        width: 100%;
      }

      /* ── Lite card form ── */
      .card-form {
        max-width: 420px;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      .form-row {
        display: flex;
        gap: 1rem;
      }
      .form-row .form-group {
        flex: 1;
      }
      /* Container divs for Skyflow iframe inputs */
      .skyflow-field {
        min-height: 48px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 0.85rem;
        background-color: #4a90e2;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 1.5rem;
      }
      .btn:hover {
        background-color: #357abd;
      }
      .btn:disabled {
        background-color: #a0b8d8;
        cursor: not-allowed;
      }
      .cart-details {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
    </style>
  <script defer src="bundle.js"></script></head>

  <body>
    <div class="checkout-container">
      <div class="tab-container">
        <a
          href="?mode=inline"
          class="tab"
          data-mode="inline"
          onclick="switchTab('inline'); return false;"
          >Inline Checkout</a
        >
        <a href="?mode=lite" class="tab" data-mode="lite" onclick="switchTab('lite'); return false;"
          >Lite Inline Checkout</a
        >
      </div>

      <!-- ── Lite Checkout ── -->
      <div id="lite-content" class="tab-content">
        <div class="cart-details">
          <span>Total&nbsp;</span>
          <div id="cart-total-lite">$399</div>
        </div>

        <div class="card-form">
          <!-- Skyflow iframe containers — IDs match the default #collect_<field> pattern -->
          <div class="form-group">
            <div id="collect_cardholder_name" class="skyflow-field"></div>
          </div>
          <div class="form-group">
            <div id="collect_card_number" class="skyflow-field"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <div id="collect_expiration_month" class="skyflow-field"></div>
            </div>
            <div class="form-group">
              <div id="collect_expiration_year" class="skyflow-field"></div>
            </div>
          </div>
          <div class="form-group">
            <div id="collect_cvv" class="skyflow-field"></div>
          </div>

          <button class="btn" id="pay-button-lite">Pagar Ahora</button>
        </div>
      </div>

      <!-- ── Inline Checkout ── -->
      <div id="inline-content" class="tab-content">
        <div class="cart-details">
          <span>Total&nbsp</span>
          <div id="cart-total">$399</div>
        </div>
        <form id="payment-form">
          <div id="tonder-checkout"></div>
        </form>
        <div class="button-container">
          <button id="pay-button">Pagar</button>
        </div>
      </div>
    </div>
  </body>
  <script src="https://js.skyflow.com/v1/index.js"></script>
  <script src="https://openpay.s3.amazonaws.com/openpay.v1.min.js"></script>
  <script src="https://openpay.s3.amazonaws.com/openpay-data.v1.min.js"></script>
</html>
